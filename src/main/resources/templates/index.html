<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高校选课管理系统</title>
    <style>
        :root {
            --page: #eef2f7;
            --page-2: #dfe7ef;
            --ink: #17202f;
            --muted: #627084;
            --panel: rgba(255, 255, 255, 0.88);
            --panel-strong: #ffffff;
            --line: rgba(39, 55, 77, 0.13);
            --navy: #16243a;
            --navy-soft: #213552;
            --teal: #0f8b8d;
            --green: #16865a;
            --gold: #c78b2d;
            --red: #b54747;
            --blue: #2b6fbb;
            --shadow: 0 22px 60px rgba(22, 36, 58, 0.16);
            --shadow-soft: 0 12px 28px rgba(22, 36, 58, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                    linear-gradient(135deg, rgba(15, 139, 141, 0.14), transparent 34%),
                    linear-gradient(225deg, rgba(199, 139, 45, 0.16), transparent 36%),
                    repeating-linear-gradient(90deg, rgba(22, 36, 58, 0.04) 0 1px, transparent 1px 84px),
                    repeating-linear-gradient(0deg, rgba(22, 36, 58, 0.035) 0 1px, transparent 1px 84px),
                    linear-gradient(180deg, var(--page), var(--page-2));
            color: var(--ink);
            font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
            line-height: 1.5;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(rgba(255, 255, 255, 0.34) 1px, transparent 1px);
            background-size: 100% 9px;
            opacity: 0.26;
        }

        .app-shell {
            position: relative;
            max-width: 1220px;
            margin: 0 auto;
            padding: 30px 20px 48px;
        }

        .topbar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 24px;
            align-items: end;
            padding: 26px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 18px;
            background:
                    linear-gradient(135deg, rgba(22, 36, 58, 0.98), rgba(33, 53, 82, 0.94)),
                    linear-gradient(90deg, rgba(15, 139, 141, 0.35), rgba(199, 139, 45, 0.25));
            box-shadow: var(--shadow);
            color: #fff;
        }

        .topbar::after {
            content: "";
            position: absolute;
            width: 360px;
            height: 360px;
            right: -90px;
            top: -170px;
            pointer-events: none;
            background:
                    linear-gradient(45deg, transparent 46%, rgba(255, 255, 255, 0.18) 47% 53%, transparent 54%),
                    linear-gradient(-45deg, transparent 46%, rgba(255, 255, 255, 0.10) 47% 53%, transparent 54%);
            background-size: 34px 34px;
            transform: rotate(12deg);
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: #b7f3e8;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "";
            width: 28px;
            height: 2px;
            background: #b7f3e8;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 4vw, 46px);
            line-height: 1.08;
            letter-spacing: 0;
        }

        .subtitle {
            max-width: 620px;
            margin: 12px 0 0;
            color: rgba(255, 255, 255, 0.72);
            font-size: 15px;
        }

        .metric-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(120px, 1fr));
            gap: 12px;
            min-width: 270px;
            position: relative;
            z-index: 1;
        }

        .metric {
            padding: 15px 16px;
            border: 1px solid rgba(255, 255, 255, 0.20);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.10);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(10px);
        }

        .metric strong {
            display: block;
            font-size: 28px;
            line-height: 1;
        }

        .metric span {
            display: block;
            margin-top: 8px;
            color: rgba(255, 255, 255, 0.72);
            font-size: 13px;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(290px, 380px) minmax(0, 1fr);
            gap: 20px;
            margin-top: 22px;
            align-items: start;
        }

        .section {
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--panel);
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(18px);
        }

        aside .section {
            padding: 18px;
        }

        .section + .section {
            margin-top: 16px;
        }

        .main-panel {
            padding: 18px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 14px;
            font-size: 18px;
            letter-spacing: 0;
        }

        .section-title::before {
            content: "";
            width: 9px;
            height: 26px;
            border-radius: 999px;
            background: linear-gradient(180deg, var(--teal), var(--gold));
            box-shadow: 0 8px 18px rgba(15, 139, 141, 0.24);
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
        }

        textarea,
        input {
            width: 100%;
            border: 1px solid rgba(39, 55, 77, 0.18);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.94);
            color: var(--ink);
            font: inherit;
            font-size: 14px;
            outline: none;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
            transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
        }

        textarea {
            min-height: 268px;
            resize: vertical;
            padding: 13px 14px;
        }

        input {
            height: 44px;
            padding: 0 14px;
        }

        textarea:focus,
        input:focus {
            border-color: rgba(15, 139, 141, 0.65);
            box-shadow: 0 0 0 4px rgba(15, 139, 141, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.72);
            transform: translateY(-1px);
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 13px;
            flex-wrap: wrap;
        }

        button,
        .button-link {
            min-height: 42px;
            border: 0;
            border-radius: 999px;
            padding: 0 18px;
            background: linear-gradient(135deg, var(--green), var(--teal));
            color: #fff;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 24px rgba(15, 139, 141, 0.24);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        button:hover,
        .button-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 30px rgba(15, 139, 141, 0.30);
            filter: saturate(1.08);
        }

        .button-secondary {
            background: linear-gradient(135deg, var(--blue), var(--navy-soft));
            box-shadow: 0 12px 24px rgba(43, 111, 187, 0.20);
        }

        .message {
            margin: 0 0 16px;
            padding: 13px 15px;
            border: 1px solid rgba(22, 134, 90, 0.18);
            border-left: 6px solid var(--green);
            border-radius: 14px;
            background: linear-gradient(90deg, rgba(22, 134, 90, 0.12), rgba(255, 255, 255, 0.72));
            color: #164c39;
            font-weight: 800;
        }

        .error-list {
            margin: 14px 0 0;
            padding: 12px 14px 12px 30px;
            border: 1px solid rgba(181, 71, 71, 0.16);
            border-left: 6px solid var(--red);
            border-radius: 14px;
            background: #fff3f1;
            color: var(--red);
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--panel-strong);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th,
        td {
            padding: 13px 14px;
            border-bottom: 1px solid rgba(39, 55, 77, 0.09);
            text-align: left;
            vertical-align: middle;
            font-size: 14px;
        }

        th {
            position: sticky;
            top: 0;
            background: linear-gradient(180deg, #f8fafc, #eef3f7);
            color: #344258;
            font-size: 13px;
            letter-spacing: 0.04em;
        }

        tbody tr {
            transition: background 150ms ease;
        }

        tbody tr:hover {
            background: rgba(15, 139, 141, 0.06);
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .type-badge {
            display: inline-flex;
            min-width: 64px;
            height: 28px;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(15, 139, 141, 0.18);
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(15, 139, 141, 0.12), rgba(199, 139, 45, 0.10));
            color: #23515c;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
        }

        .group-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-top: 18px;
        }

        .group {
            min-height: 148px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 16px;
            background:
                    linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(248, 251, 252, 0.94)),
                    linear-gradient(135deg, rgba(15, 139, 141, 0.10), rgba(199, 139, 45, 0.12));
            box-shadow: 0 10px 24px rgba(22, 36, 58, 0.08);
        }

        .group h3 {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 0;
            padding: 13px 14px;
            border-bottom: 1px solid rgba(39, 55, 77, 0.09);
            font-size: 15px;
            background: rgba(255, 255, 255, 0.72);
        }

        .group-count {
            display: inline-flex;
            min-width: 28px;
            height: 28px;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: var(--navy);
            color: #fff;
            font-size: 13px;
        }

        .mini-list {
            margin: 0;
            padding: 12px 14px 14px;
            list-style: none;
            color: var(--muted);
            font-size: 13px;
        }

        .mini-list li {
            padding-left: 12px;
            border-left: 3px solid rgba(15, 139, 141, 0.30);
        }

        .mini-list li + li {
            margin-top: 8px;
        }

        .empty {
            padding: 18px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.72);
            border: 1px dashed rgba(39, 55, 77, 0.18);
            border-radius: 14px;
        }

        .group .empty {
            margin: 12px 14px 14px;
            padding: 12px;
        }

        @media (max-width: 900px) {
            .topbar {
                grid-template-columns: 1fr;
                align-items: start;
            }

            .metric-row {
                width: 100%;
                min-width: 0;
            }

            .layout,
            .group-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 560px) {
            .app-shell {
                padding: 16px 12px 32px;
            }

            .topbar,
            aside .section,
            .main-panel {
                border-radius: 14px;
                padding: 16px;
            }

            .metric-row {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
<main class="app-shell">
    <header class="topbar">
        <div>
            <div class="eyebrow">Enrollment Console</div>
            <h1>高校选课管理系统</h1>
            <p class="subtitle">学生选课基础处理工具：批量导入、智能去重、分类检索与结果展示。</p>
        </div>
        <div class="metric-row">
            <div class="metric">
                <strong th:text="${#lists.size(records)}">0</strong>
                <span>当前记录</span>
            </div>
            <div class="metric">
                <strong>3</strong>
                <span>课程类型</span>
            </div>
        </div>
    </header>

    <div class="layout">
        <aside>
            <section class="section">
                <h2 class="section-title">CSV 批量导入</h2>
                <form th:action="@{/enrollments/import}" method="post">
                    <label for="csvText">每行一条：学生ID,课程ID,课程名称,课程类型</label>
                    <textarea id="csvText" name="csvText" th:text="${csvText}"
                              placeholder="S000001,C000001,Java程序设计,专业课&#10;S000002,C000003,计算机网络,公共课"></textarea>
                    <div class="button-row">
                        <button type="submit">导入数据</button>
                        <a class="button-link button-secondary" th:href="@{/}">重置样例</a>
                    </div>
                </form>

                <ul class="error-list" th:if="${errors != null and !#lists.isEmpty(errors)}">
                    <li th:each="error : ${errors}" th:text="${error}">格式错误</li>
                </ul>
            </section>

            <section class="section">
                <h2 class="section-title">选课检索</h2>
                <form th:action="@{/enrollments/search}" method="get">
                    <label for="keyword">学生ID / 课程ID / 课程名称 / 课程类型</label>
                    <input id="keyword" name="keyword" type="search" th:value="${keyword}" placeholder="例如：S000001 或 专业课">
                    <div class="button-row">
                        <button class="button-secondary" type="submit">检索</button>
                    </div>
                </form>
            </section>
        </aside>

        <section class="section main-panel">
            <p class="message" th:text="${message}">已加载后台样例选课数据</p>

            <div class="table-wrap" th:if="${!#lists.isEmpty(records)}">
                <table>
                    <thead>
                    <tr>
                        <th>学生 ID</th>
                        <th>课程 ID</th>
                        <th>课程名称</th>
                        <th>课程类型</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="record : ${records}">
                        <td th:text="${record.studentId}">S000001</td>
                        <td th:text="${record.courseId}">C000001</td>
                        <td th:text="${record.courseName}">Java程序设计</td>
                        <td><span class="type-badge" th:text="${record.courseType}">专业课</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="empty" th:if="${#lists.isEmpty(records)}">无匹配选课记录</div>

            <div class="group-grid">
                <div class="group" th:each="entry : ${groupedRecords}">
                    <h3>
                        <span th:text="${entry.key}">专业课</span>
                        <span class="group-count" th:text="${#lists.size(entry.value)}">0</span>
                    </h3>
                    <ul class="mini-list" th:if="${!#lists.isEmpty(entry.value)}">
                        <li th:each="record : ${entry.value}"
                            th:text="${record.studentId + ' / ' + record.courseId + ' / ' + record.courseName}">
                            S000001 / C000001 / Java程序设计
                        </li>
                    </ul>
                    <div class="empty" th:if="${#lists.isEmpty(entry.value)}">暂无记录</div>
                </div>
            </div>
        </section>
    </div>
</main>
</body>
</html>
